name: Harness Minimum

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  harness-minimum:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m venv .venv
          . ./.venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-harness.txt

      - name: Prepare compose environment
        run: cp .env.example .env

      - name: Run harness minimum
        run: make harness-minimum

      - name: Run Docker image smoke
        run: make test-docker-image-smoke
