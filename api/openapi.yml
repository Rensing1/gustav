        instruction_md:
          type: string
          minLength: 1
          description: Task instruction (Markdown)
        criteria:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 0
          maxItems: 10
          description: Optional evaluation criteria; one line per item
        teacher_context_md:
          type: string
          nullable: true
          description: Optional teacher-only AI context (Markdown). Must never be shown to students.
        due_at:
          type: string
          format: date-time
          nullable: true
        max_attempts:
          type: integer
          minimum: 1
          nullable: true
        h5p:
          $ref: '#/components/schemas/H5PTaskConfig'
          nullable: true
          description: Optional. When set, creates an H5P task. Mutually exclusive with `visual`, `scratch`, and `calliope`.
        visual:
          $ref: '#/components/schemas/VisualTaskConfig'
          nullable: true
          description: Optional. When set, creates a visual task. Mutually exclusive with `h5p`, `scratch`, and `calliope`.
        scratch:
          $ref: '#/components/schemas/ScratchTaskConfig'
          nullable: true
          description: Optional. When set, creates a Scratch task. Mutually exclusive with `h5p`, `visual`, and `calliope`.
        calliope:
          $ref: '#/components/schemas/CalliopeTaskConfig'
          nullable: true
          description: Optional. When set, creates a Calliope task. Mutually exclusive with `h5p`, `visual`, and `scratch`.
    TaskUpdate:
      type: object
      properties:
        instruction_md:
          type: string
          minLength: 1
        criteria:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 0
          maxItems: 10
        teacher_context_md:
          type: string
          nullable: true
          description: Optional teacher-only AI context (Markdown). Must never be shown to students.
        due_at:
          type: string
          format: date-time
          nullable: true
        max_attempts:
          type: integer
          minimum: 1
          nullable: true
        h5p:
          $ref: '#/components/schemas/H5PTaskConfig'
          nullable: true
          description: Optional. When set, updates the H5P configuration. Mutually exclusive with `visual`, `scratch`, and `calliope`.
        visual:
          $ref: '#/components/schemas/VisualTaskConfig'
          nullable: true
          description: Optional. When set, updates the visual configuration. Mutually exclusive with `h5p`, `scratch`, and `calliope`.
        scratch:
          $ref: '#/components/schemas/ScratchTaskConfig'
          nullable: true
          description: Optional. When set, updates the Scratch configuration. Mutually exclusive with `h5p`, `visual`, and `calliope`.
        calliope:
          $ref: '#/components/schemas/CalliopeTaskConfig'
          nullable: true
          description: Optional. When set, updates the Calliope configuration. Mutually exclusive with `h5p`, `visual`, and `scratch`.
    TaskReorder:
      type: object
      required: [task_ids]
      properties:
        task_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: Desired order (1..n) of task IDs for the given section
    CourseModule:
      type: object
      required: [id, course_id, unit_id, position, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        course_id:
          type: string
          format: uuid
        unit_id:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 1
          description: 1-based ordering within the course
        context_notes:
          type: string
          maxLength: 2000
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CourseModuleCreate:
      type: object
      required: [unit_id]
      properties:
        unit_id:
          type: string
          format: uuid
        context_notes:
          type: string
          maxLength: 2000
          nullable: true
    CourseModuleReorder:
      type: object
      required: [module_ids]
      properties:
        module_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: Desired order (1..n) of course_module IDs for the given course
    LearningSectionCore:
      type: object
      required: [id, title, position, unit_id]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        position:
          type: integer
          minimum: 1
          description: 1-based ordering within the course release
        unit_id:
          type: string
          format: uuid
          description: Identifier of the learning unit this section belongs to (for UI grouping/filtering).
    LearningMaterial:
      type: object
      required: [id, title, kind]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          type: string
          enum: [markdown, file]
        body_md:
          type: string
          description: Markdown content (only for materials with kind=markdown)
          nullable: true
        mime_type:
          type: string
          nullable: true
          description: MIME type for file materials (null for markdown)
        size_bytes:
          type: integer
          nullable: true
          minimum: 1
          description: Declared file size (bytes) for file materials
        filename_original:
          type: string
          nullable: true
          description: Original filename supplied by the author (files only)
        file_url:
          type: string
          format: uri
          nullable: true
          description: Short-lived inline preview/download URL for file materials visible to the student
        alt_text:
          type: string
          nullable: true
          maxLength: 500
          description: Alternative text supplied by teachers for accessibility
        position:
          type: integer
          nullable: true
          minimum: 1
          description: Ordering within the section
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    LearningTask:
      type: object
      required: [id, instruction_md, criteria, kind]
      properties:
        id:
          type: string
          format: uuid
        instruction_md:
          type: string
          minLength: 1
          description: Task instructions displayed to students
        criteria:
          type: array
          items:
            type: string
            minLength: 1
          maxItems: 10
          description: Evaluation criteria shown to the student
        due_at:
          type: string
          format: date-time
          nullable: true
        max_attempts:
          type: integer
          minimum: 1
          nullable: true
        has_submission:
          type: boolean
          description: True when the learner has at least one stored submission for this task.
        latest_submission_intent:
          type: string
          nullable: true
          enum: [feedback, submit]
          description: Intent of the learner's newest submission for this task.
        latest_submission_analysis_status:
          type: string
          nullable: true
          enum: [pending, extracted, completed, failed]
          description: Analysis status of the learner's newest submission for this task.
        latest_submission_created_at:
          type: string
          format: date-time
          nullable: true
          description: Creation timestamp of the learner's newest submission for this task.
        latest_final_submission_at:
          type: string
          format: date-time
          nullable: true
          description: Creation timestamp of the learner's newest final submission (`intent=submit`) for this task.
        kind:
          type: string
          enum: [native, h5p, visual, scratch, calliope]
          description: Backend task type identifier.
        h5p:
          $ref: '#/components/schemas/H5PTaskConfig'
          nullable: true
        visual:
          $ref: '#/components/schemas/VisualTaskConfig'
          nullable: true
        scratch:
          $ref: '#/components/schemas/ScratchTaskConfig'
          nullable: true
        calliope:
          $ref: '#/components/schemas/CalliopeTaskConfig'
          nullable: true
    LearningSection:
      type: object
      required: [section, materials, tasks]
      properties:
        section:
          $ref: '#/components/schemas/LearningSectionCore'
        materials:
          type: array
          items:
            $ref: '#/components/schemas/LearningMaterial'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/LearningTask'
    AnalysisJsonCriteriaV1:
      type: object
      additionalProperties: false
      required: [schema, score, criteria_results]
      properties:
        schema:
          type: string
          enum: ["criteria.v1"]
          description: Version tag for the analysis payload structure.
        score:
          type: integer
          minimum: 0
          maximum: 5
          description: Overall formative score derived from the criteria.
        criteria_results:
          type: array
          description: Per-criterion scoring result shown to learners.
          items:
            type: object
            required: [criterion, score, explanation_md]
            additionalProperties: false
            properties:
              criterion:
                type: string
                description: Display name of the rubric criterion.
              score:
                type: integer
                minimum: 0
                maximum: 10
                description: Criterion score between 0 and 10.
              explanation_md:
                type: string
                description: Markdown explanation tying the score back to the criterion.
    AnalysisJsonCriteriaV2:
      type: object
      additionalProperties: false
      required: [schema]
      properties:
        schema:
          type: string
          enum: ["criteria.v2"]
          description: Version tag for the analysis payload structure (criteria v2).
        score:
          type: integer
          minimum: 0
          maximum: 5
          description: Overall formative score derived from the criteria (0..5, retained for backwards compatibility).
        criteria_results:
          type: array
          description: Per-criterion scoring result shown to learners.
          items:
            type: object
            required: [criterion]
            additionalProperties: false
            properties:
              criterion:
                type: string
                description: Display name of the rubric criterion.
              score:
                type: integer
                minimum: 0
                maximum: 10
                description: Criterion score between 0 and max_score (default 10).
              max_score:
                type: integer
                minimum: 1
                default: 10
                description: Maximum achievable score for the criterion (defaults to 10).
              explanation_md:
                type: string
                description: Objective analysis in Markdown (rendered safely on the UI).
    SubmissionTelemetry:
      type: object
      additionalProperties: false
      required:
        - vision_attempts
        - vision_last_error
        - feedback_last_attempt_at
        - feedback_last_error
      properties:
        vision_attempts:
          type: integer
          format: int32
          minimum: 0
          default: 0
          description: Number of OCR/vision attempts.
        vision_last_error:
          type: string
          nullable: true
          maxLength: 256
          description: |-
            Sanitized last error returned by the vision adapter; student-visible,
            therefore secrets/paths are stripped and long messages truncated.
        feedback_last_attempt_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the last feedback adapter invocation.
        feedback_last_error:
          type: string
          nullable: true
          maxLength: 256
          description: |-
            Sanitized feedback adapter error text. Intended for teachers but always
            truncated/cleaned before exposure.
    LearningSubmission:
      allOf:
        - $ref: '#/components/schemas/SubmissionTelemetry'
        - type: object
          required: [id, attempt_nr, intent, kind, analysis_status, created_at]
          properties:
            id:
              type: string
              format: uuid
            attempt_nr:
              type: integer
              minimum: 1
            intent:
              type: string
              enum: [feedback, submit]
              description: Distinguishes informal feedback requests from formal submissions.
            kind:
              type: string
              enum: [text, image, file, h5p]
            score_raw:
              type: integer
              nullable: true
              minimum: 0
              description: Raw score reported by the H5P runtime for `kind=h5p`.
            score_max:
              type: integer
              nullable: true
              minimum: 0
              description: Maximum score reported by the H5P runtime for `kind=h5p`.
            text_body:
              type: string
              nullable: true
              description: Unified text representation; empty while analysis is pending or when OCR/analysis failed.
            mime_type:
              type: string
              nullable: true
            size_bytes:
              type: integer
              nullable: true
            storage_key:
              type: string
              nullable: true
            sha256:
              type: string
              nullable: true
              pattern: '^[0-9a-f]{64}$'
            files:
              type: array
              description: |-
                Optional learner-visible artifacts for file/image submissions.
                Uses short-lived signed URLs so earlier upload attempts can be
                opened again in the history workspace without exposing storage
                keys directly.
              items:
                type: object
                required: [mime, size, url]
                properties:
                  mime:
                    type: string
                  size:
                    type: integer
                  url:
                    type: string
                    format: uri
            analysis_status:
              type: string
              enum: [pending, extracted, completed, failed]
              description: >-
                Analysis lifecycle: pending (queued), extracted (PDF successfully parsed into images/text),
                completed (feedback available), failed (processing halted; inspect error_code).
            error_code:
              type: string
              nullable: true
              enum:
                - vision_retrying
                - vision_failed
                - feedback_retrying
                - feedback_failed
                - feedback_invalid_analysis
                - input_corrupt
                - input_unsupported
                - input_too_large
              description: >-
                Normalized error indicator for processing.
                `*_retrying` marks in-flight retries, `*_failed` indicates that analysis stopped,
                and `input_*` values signal validation/pre-processing failures before AI execution.
            analysis_json:
              nullable: true
              description: |-
                Structured criteria-based feedback payload (criteria.v1 or criteria.v2).
                Remains `null` for `pending` and `extracted` submissions; the payload
                is only populated once feedback has been issued. Internal extraction
                metadata such as page keys is stored separately and never exposed.
              oneOf:
                - $ref: '#/components/schemas/AnalysisJsonCriteriaV1'
                - $ref: '#/components/schemas/AnalysisJsonCriteriaV2'
            feedback_md:
              type: string
              nullable: true
              description: Markdown feedback for the learner; null until the analysis has completed.
    TeachingLatestSubmission:
      type: object
      additionalProperties: false
      required: [id, task_id, student_sub, created_at, kind, instruction_md]
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        student_sub:
          type: string
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        kind:
          type: string
          enum: [text, image, pdf, file, h5p]
        instruction_md:
          type: string
          description: Task instruction rendered in teacher detail views above the submission content.
        score_raw:
          type: integer
          nullable: true
          minimum: 0
          description: Raw score (only present for `kind=h5p`).
        score_max:
          type: integer
          nullable: true
          minimum: 0
          description: Maximum score (only present for `kind=h5p`).
        h5p:
          type: object
          nullable: true
          additionalProperties: false
          description: H5P metadata (only present for `kind=h5p`).
          properties:
            content_id:
              type: string
              nullable: true
              description: Opaque H5P content id linked to the task.
            review_token:
              type: string
              nullable: true
              description: >-
                Short-lived, signed review capability token (teacher-only). Used by
                `GET /h5p/player/review` to load the student state in strict read-only mode.
        text_body:
          type: string
          maxLength: 65536
          description: |
            Best-effort extracted text, even for file/image/pdf submissions once
            processing has completed. The content matches the learner-facing
            text_body representation and is only shortened to the global
            text_body limit defined by the Learning API (currently 64k characters, i.e. 65,536).
          nullable: true
        files:
          type: array
          description: |
            Original upload(s) with signed, short-lived URLs. Present for
            file/image/pdf submissions; empty for text submissions in the normal
            case. In rare fallback situations (e.g. when Storage or helper
            functions are temporarily unavailable) the field may be omitted, while
            the rest of the domain object (`text_body`, `feedback_md`,
            `analysis_json`) remains available.
          items:
            type: object
            required: [mime, size, url]
            properties:
              mime: { type: string }
              size: { type: integer }
              url:
                type: string
                format: uri
                description: Signed, short-lived URL (do not cache beyond TTL)
        feedback_md:
          type: string
          nullable: true
          description: Markdown feedback for the learner (owner-visible); present when analysis is completed.
        analysis_json:
          nullable: true
          description: Optional structured analysis payload (read-only excerpt for the Auswertung-Tab).
          oneOf:
            - $ref: '#/components/schemas/AnalysisJsonCriteriaV1'
            - $ref: '#/components/schemas/AnalysisJsonCriteriaV2'

    LearningCourse:
      type: object
      required: [id, title]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
        subject:
          type: string
          nullable: true
        grade_level:
          type: string
          nullable: true
        term:
          type: string
          nullable: true
    UnitPublic:
      type: object
      required: [id, title, unit_type]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        summary:
          type: string
          nullable: true
        unit_type:
          $ref: '#/components/schemas/UnitType'

    LearningUnitGraphUnit:
      type: object
      required: [id, title, unit_type]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        unit_type:
          $ref: '#/components/schemas/UnitType'

    LearningUnitPhase:
      type: object
      required: [id, title, position]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        position:
          type: integer
          minimum: 1
          description: 1-based ordering of phases within the unit.

    LearningUnitModuleStatus:
      type: string
      enum: [locked, open, done]
      description: Per-student module state within a course.

    LearningUnitGraphModule:
      type: object
      required:
        - id
        - title
        - phase_id
        - position_in_phase
        - required_prereq_count
        - prereq_done
        - prereq_required
        - tasks_done
        - tasks_total
        - materials_count
        - status
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        phase_id:
          type: string
          format: uuid
        position_in_phase:
          type: integer
          minimum: 1
        required_prereq_count:
          type: integer
          minimum: 0
          description: k value for "k-of-n" unlock logic on this module (target node).
        prereq_done:
          type: integer
          minimum: 0
          description: Number of satisfied prerequisites (done incoming modules).
        prereq_required:
          type: integer
          minimum: 0
          description: Required prerequisite count after clamping (0..incoming_count).
        tasks_done:
          type: integer
          minimum: 0
          description: >
            Number of completed tasks in this module for the current student.
            Non-H5P tasks count as done when at least one submission exists;
            H5P tasks count only for full-score submissions (`score_raw = score_max`).
        tasks_total:
          type: integer
          minimum: 0
        materials_count:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/LearningUnitModuleStatus'

    LearningUnitGraphEdge:
      type: object
      required: [from, to]
      additionalProperties: false
      properties:
        from:
          type: string
          format: uuid
        to:
          type: string
          format: uuid

    LearningUnitModulesGraphResponse:
      type: object
      required: [unit, phases, modules, edges]
      additionalProperties: false
      properties:
        unit:
          $ref: '#/components/schemas/LearningUnitGraphUnit'
        phases:
          type: array
          items:
            $ref: '#/components/schemas/LearningUnitPhase'
        modules:
          type: array
          items:
            $ref: '#/components/schemas/LearningUnitGraphModule'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/LearningUnitGraphEdge'

    LearningModuleCore:
      type: object
      required: [id, title, unit_id, phase_id, position_in_phase]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        unit_id:
          type: string
          format: uuid
        phase_id:
          type: string
          format: uuid
        position_in_phase:
          type: integer
          minimum: 1

    LearningModuleContent:
      type: object
      required: [module, materials, tasks]
      properties:
        module:
          $ref: '#/components/schemas/LearningModuleCore'
        materials:
          type: array
          items:
            $ref: '#/components/schemas/LearningMaterial'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/LearningTask'

    # Teaching — Live unit view (teacher-only)
    TeachingStudentRef:
      type: object
      required: [sub, name]
      additionalProperties: false
      properties:
        sub:
          type: string
          description: Subject identifier (OIDC sub) of the student
        name:
          type: string
          description: Display name for teacher-facing views
    TeachingUnitTaskCell:
      type: object
      required: [task_id, has_submission]
      additionalProperties: false
      properties:
        task_id:
          type: string
          format: uuid
          description: Task identifier within the unit
        has_submission:
          type: boolean
          description: True if at least one submission exists for this student and task
        h5p_completed:
          type: boolean
          nullable: true
          description: >
            Only for H5P tasks. True when the student has at least one H5P submission
            with full score (score_raw == score_max, including 0/0). Null for non-H5P tasks.
        score_raw:
          type: integer
          nullable: true
          description: >
            Only for H5P tasks. Raw score of the latest H5P submission. Null
            when no H5P submission exists.
        score_max:
          type: integer
          nullable: true
          description: >
            Only for H5P tasks. Maximum score of the latest H5P submission.
            Null when no H5P submission exists.
        average_score:
          type: number
          format: float
          minimum: 0
          maximum: 10
          nullable: true
          description: >
            Optional average criteria score (0..10) for the latest submission.
            Null when no completed analysis is available.
    TeachingUnitLiveRow:
      type: object
      required: [student, tasks]
      additionalProperties: false
      properties:
        student:
          $ref: '#/components/schemas/TeachingStudentRef'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TeachingUnitTaskCell'
    TeachingUnitDeltaCell:
      type: object
      description: Single cell change in the live overview matrix.
      required: [student_sub, task_id, has_submission, changed_at]
      additionalProperties: false
      properties:
        student_sub:
          type: string
          description: Student identifier (OIDC sub).
        task_id:
          type: string
          format: uuid
          description: Task identifier within the unit.
        has_submission:
          type: boolean
          description: True if at least one submission exists after the change; false when none exist.
        h5p_completed:
          type: boolean
          nullable: true
          description: >
            Only for H5P tasks. True when the student has at least one H5P submission
            with full score (score_raw == score_max, including 0/0). Null for non-H5P tasks.
        score_raw:
          type: integer
          nullable: true
          description: >
            Only for H5P tasks. Raw score of the latest H5P submission at the
            time of this change. Null when no H5P submission exists.
        score_max:
          type: integer
          nullable: true
          description: >
            Only for H5P tasks. Maximum score of the latest H5P submission at
            the time of this change. Null when no H5P submission exists.
        average_score:
          type: number
          format: float
          minimum: 0
          maximum: 10
          nullable: true
          description: >
            Optional average criteria score (0..10) for the latest submission
            at the time of this change. Null when no completed analysis
            is available.
        changed_at:
          type: string
          format: date-time
          description: Timestamp (ISO8601 UTC) of the most recent submission status change.
    TeachingStudentLiveOverviewTask:
      type: object
      required: [id, instruction_md, position, kind, has_submission]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        instruction_md:
          type: string
          description: Task instruction (Markdown).
        position:
          type: integer
        kind:
          type: string
          enum: [native, h5p, visual, scratch, calliope]
        has_submission:
          type: boolean
        h5p_completed:
          type: boolean
          nullable: true
        average_score:
          type: number
          format: float
          minimum: 0
          maximum: 10
          nullable: true
    TeachingStudentLiveOverviewUnit:
      type: object
      required: [id, title, tasks]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TeachingStudentLiveOverviewTask'
    TeachingStudentLiveOverview:
      type: object
      required: [student, units]
      additionalProperties: false
      properties:
        student:
          $ref: '#/components/schemas/TeachingStudentRef'
        units:
          type: array
          items:
            $ref: '#/components/schemas/TeachingStudentLiveOverviewUnit'

    StudentUploadIntentRequest:
      type: object
      required: [kind, filename, mime_type, size_bytes]
      properties:
        kind:
          type: string
          enum: [image, file]
          description: Upload kind for the submission asset.
        filename:
          type: string
          minLength: 1
          maxLength: 255
        mime_type:
          type: string
          description: >-
            Expected MIME type (image/jpeg, image/png, application/pdf,
            application/x.scratch.sb3, application/x.makecode.hex). Compared
            case-insensitively; canonical values are lowercase.
        size_bytes:
          type: integer
          minimum: 1
          maximum: 10485760
          description: Declared file size in bytes (max 10 MiB)
    StudentUploadIntentResponse:
      type: object
      required: [intent_id, storage_key, url, headers, accepted_mime_types, max_size_bytes, expires_at]
      properties:
        intent_id:
          type: string
          format: uuid
        storage_key:
          type: string
        url:
          type: string
          format: uri
          description: >-
            Absolute presigned URL for client-side PUT upload (https://...).
        headers:
          type: object
          additionalProperties:
            type: string
        accepted_mime_types:
          type: array
          items:
            type: string
        max_size_bytes:
          type: integer
          minimum: 1
        expires_at:
          type: string
          format: date-time

paths:
  /health:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Health check
      description: Lightweight readiness probe for orchestration and tests.
      security: []
      responses:
        '200':
          description: Service is healthy
          headers:
            Cache-Control:
              description: Security — not cacheable.
