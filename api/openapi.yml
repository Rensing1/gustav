        - "RLS: author-only policies limit task visibility to the owning teacher."
      x-permissions:
        requiredRole: teacher
        ownerOnly: true
      parameters:
        - in: path
          name: course_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted (no content)
          headers:
            Cache-Control:
              description: Security — responses are private and not cacheable by shared caches.
              schema:
                type: string
                example: private, no-store
        '401': { $ref: '#/components/responses/Unauthorized401' }
        '403': { $ref: '#/components/responses/Forbidden403' }
