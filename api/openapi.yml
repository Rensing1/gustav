          schema:
            type: string
          description: "Task context id (in GUSTAV: task_id) to isolate user state per task instance."
        - in: query
          name: review_token
          required: true
          schema:
            type: string
          description: Short-lived, signed capability token issued by the Teaching API.
        - in: query
          name: read_only_state
          required: false
          schema:
            type: boolean
          description: >-
