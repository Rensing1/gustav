                type: string
                example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          headers:
            Cache-Control:
              description: Security — responses are private and not cacheable by shared caches.
