  /api/teaching/courses:
    get:
      tags: [Teaching]
      summary: List courses for the current user
      description: >-
        Teachers see courses where they are the owner (teacher_id == sub).
        Students see courses where they are a member.
      operationId: listCourses
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of courses
          headers:
            Cache-Control:
              description: Security — responses must not be cached
              schema:
                type: string
                example: private, no-store
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
        '401': { $ref: '#/components/responses/Unauthorized401' }
        '403': { $ref: '#/components/responses/Forbidden403' }
    post:
      tags: [Teaching]
      summary: Create a course (teacher only)
      operationId: createCourse
      security:
        - cookieAuth: []
      x-security-notes:
        - "CSRF: Same-origin required (Origin/Referer must match server origin)."
        - "RLS: ownership enforced; only the author can read this resource."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseCreate'
      responses:
        '201':
          description: Course created
          headers:
            Cache-Control:
              description: Security — responses are private and not cacheable by shared caches.
              schema:
                type: string
                example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          description: |
            Invalid input. detail codes:
              - invalid_input (e.g., blank title or exceeds length limits)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_input:
                  summary: Invalid payload (e.g., blank title)
                  value:
                    error: bad_request
                    detail: invalid_input
        '401': { $ref: '#/components/responses/Unauthorized401' }
        '403':
          description: Forbidden (not a teacher)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/teaching/courses/{course_id}:
    get:
      tags: [Teaching]
      summary: Get a course by id (owner only)
      description: |
        Returns the course when the caller owns it. Responds 404 when the
        course does not exist and 403 when the caller is not the owner.
      operationId: getCourse
      security:
        - cookieAuth: []
      x-permissions:
        requiredRole: teacher
        ownerOnly: true
      parameters:
        - in: path
          name: course_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Course
          headers:
            Cache-Control:
              description: Security — responses must not be cached
              schema:
                type: string
                example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          description: |
            Invalid input. detail codes:
              - invalid_course_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': { $ref: '#/components/responses/Unauthorized401' }
        '403': { $ref: '#/components/responses/Forbidden403' }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    patch:
      tags: [Teaching]
      summary: Update a course (owner only)
      operationId: updateCourse
      security:
        - cookieAuth: []
      x-security-notes:
        - "CSRF: Same-origin required (Origin/Referer must match server origin)."
        - "RLS: author-only policies scope sections to the calling teacher."
      x-permissions:
        requiredRole: teacher
        ownerOnly: true
      parameters:
        - in: path
          name: course_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseUpdate'
      responses:
        '200':
          description: Updated course
          headers:
            Cache-Control:
              description: Security — responses are private and not cacheable by shared caches.
              schema:
                type: string
                example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          description: |
            Invalid input. detail codes:
              - invalid_field (e.g., blank title)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_field:
                  summary: Invalid field update
                  value:
                    error: bad_request
                    detail: invalid_field
        '401': { $ref: '#/components/responses/Unauthorized401' }
        '403': { $ref: '#/components/responses/Forbidden403' }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [Teaching]
      summary: Delete a course (owner only)
      description: |-
