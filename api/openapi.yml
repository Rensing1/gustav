  /h5p/ajax:
    post:
      tags: [H5P]
      summary: H5P runtime Ajax endpoint
      description: >-
        Runtime endpoint required by the H5P client for translations and other actions.
        This endpoint is cookie-authenticated and must enforce strict same-origin
        checks (Origin/Referer) to reduce CSRF surface.
      operationId: postH5PAjax
      security:
        - cookieAuth: []
      x-security-notes:
        - "CSRF: Same-origin required (Origin/Referer must match server origin)."
        - "Trusted-content model: some actions are restricted to teacher/admin."
      parameters:
        - in: query
          name: action
          required: true
          schema:
            type: string
          description: H5P ajax action identifier (e.g., translations).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
          multipart/form-data:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Action response (varies by action)
          headers:
            Cache-Control:
              description: Security — responses are private and not cacheable by shared caches.
              schema:
                type: string
                example: private, no-store
            Vary:
              description: Security — responses vary by Origin
              schema:
                type: string
                example: Origin
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/plain:
              schema:
                type: string
        '400':
          description: Invalid request (e.g., missing action)
          headers:
            Cache-Control: { description: Security — private, no-store, schema: { type: string, example: private, no-store } }
            Vary: { description: Security — responses vary by Origin, schema: { type: string, example: Origin } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          description: Forbidden (csrf_violation or role not allowed for action)
          headers:
            Cache-Control: { description: Security — private, no-store, schema: { type: string, example: private, no-store } }
            Vary: { description: Security — responses vary by Origin, schema: { type: string, example: Origin } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          headers:
            Cache-Control: { description: Security — private, no-store, schema: { type: string, example: private, no-store } }
            Vary: { description: Security — responses vary by Origin, schema: { type: string, example: Origin } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

