          pattern: '^[0-9a-f]{64}$'
        alt_text:
          type: string
          description: Optional alternative text for accessibility
          maxLength: 500
    MaterialDownloadUrlResponse:
      type: object
      required: [url, expires_at]
      properties:
        url:
          type: string
          format: uri
          description: Short-lived download URL
        expires_at:
          type: string
          format: date-time
          description: ISO timestamp when the download URL expires
    H5PTaskConfig:
      type: object
      additionalProperties: false
      description: Configuration for an H5P task (auto-scorable in MVP).
      properties:
        content_id:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
          description: Numeric identifier of the H5P content item (may be null for drafts).
        display_options:
          type: object
          nullable: true
          additionalProperties: true
          description: Optional display flags passed to the H5P runtime.
    VisualTaskConfig:
      type: object
      additionalProperties: false
      description: >-
        Marker config for upload-only visual tasks. Students submit exactly one
        file (image/jpeg|image/png|application/pdf). Text submissions are
        rejected (400 invalid_input). Empty object in MVP.
    ScratchTaskConfig:
      type: object
      additionalProperties: false
      description: >-
        Marker config for upload-only Scratch tasks. Students submit exactly one
        `.sb3` file (application/x.scratch.sb3). Image/text submissions are
        rejected (400 invalid_input). Other `kind=file` MIME types (e.g.
        application/pdf) are rejected (400 invalid_file_payload). Empty object
        in MVP.
    CalliopeTaskConfig:
      type: object
      additionalProperties: false
      description: >-
        Marker config for upload-only Calliope MakeCode tasks. Students submit
        exactly one `.hex` file (application/x.makecode.hex). Image/text
        submissions are rejected (400 invalid_input). Other `kind=file` MIME
        types (e.g. application/pdf) are rejected (400 invalid_file_payload).
        Empty object in MVP.
    Task:
      type: object
      required: [id, unit_id, section_id, instruction_md, criteria, position, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        unit_id:
          type: string
          format: uuid
        section_id:
          type: string
          format: uuid
        instruction_md:
          type: string
          minLength: 1
          description: Task instruction shown to students (Markdown)
