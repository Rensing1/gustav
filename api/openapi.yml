      properties:
        id:
          type: string
          format: uuid
        unit_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        position:
          type: integer
          minimum: 1
          description: 1-based ordering within the learning unit
        visible:
          type: boolean
          description: Whether this section is currently released for students of the course.
        released_at:
          type: string
          format: date-time
          nullable: true
