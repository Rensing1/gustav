            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Learning]
      summary: Create a new submission for a task within a course
      description: >-
        Accepts text submissions directly or stores metadata for an already uploaded
        image or file asset. All submissions enter an asynchronous analysis pipeline; clients
        poll submission detail endpoints to observe status changes. Duplicate requests can
        be avoided using the optional Idempotency-Key header. Additionally, identical
        in-flight `intent=feedback` requests are deduplicated server-side and reuse the
        existing feedback submission instead of starting a second worker run.
        
        Task-type rules:
        - For `Task.kind=visual`, only `kind=image|file` is accepted (upload-only).
        - For `Task.kind=scratch`, only `kind=file` with `mime_type=application/x.scratch.sb3` is accepted (upload-only).
        - For `Task.kind=calliope`, only `kind=file` with `mime_type=application/x.makecode.hex` is accepted (upload-only).
        - For `Task.kind=h5p`, only `kind=h5p` is accepted and the score is persisted synchronously (response 201).
        - When `intent` is omitted, the server treats the request as `intent=submit` for backwards compatibility.
        - `intent=feedback` creates a feedback snapshot but does not consume the task's `max_attempts` budget.
        - `intent=submit` creates a final submission attempt and does count against `max_attempts`.
        
        Security: Requests must be same-origin when sent from a browser; cross-site
        requests with a foreign `Origin` are rejected with 403. When `Origin` is
        absent (some browsers), the server falls back to validating the `Referer` origin.
      operationId: createLearningSubmission
      security:
        - cookieAuth: []
      x-security-notes:
        - "CSRF: Same-origin required (Origin/Referer must match server origin)."
        - "RLS: student ownership and course membership enforced via policies and helpers."
        - "Failure semantics: when persistence is unavailable (repo/db down), the API returns 503 and does not pretend success."
      x-permissions:
        requiredRole: student
      parameters:
        - in: path
          name: course_id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: task_id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            maxLength: 64
            pattern: '^[A-Za-z0-9_-]{1,64}$'
          description: >-
            Optional idempotency token to de-duplicate retries (ASCII token:
            letters, digits, underscore, hyphen; case-sensitive). Retries of
            the same user action should reuse the same token; a new deliberate
            submission attempt should use a new token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [kind, text_body]
                  properties:
                    intent:
                      type: string
                      enum: [feedback, submit]
                      default: submit
                      description: Optional compatibility field. Omitted requests are treated as `submit`.
                    kind:
                      type: string
                      enum: [text]
                    text_body:
                      type: string
                      minLength: 1
                      maxLength: 65536
                - type: object
                  required: [kind, storage_key, mime_type, size_bytes, sha256]
                  properties:
                    intent:
                      type: string
                      enum: [feedback, submit]
                      default: submit
                      description: Optional compatibility field. Omitted requests are treated as `submit`.
                    kind:
                      type: string
                      enum: [image]
                    storage_key:
                      type: string
                      minLength: 1
                    mime_type:
                      type: string
                      enum: ['image/jpeg', 'image/png']
                    size_bytes:
                      type: integer
                      minimum: 1
                      maximum: 10485760
                    sha256:
                      type: string
                      pattern: '^[0-9a-f]{64}$'
                - type: object
                  required: [kind, storage_key, mime_type, size_bytes, sha256]
                  properties:
                    intent:
                      type: string
                      enum: [feedback, submit]
                      default: submit
                      description: Optional compatibility field. Omitted requests are treated as `submit`.
                    kind:
                      type: string
                      enum: [file]
                    storage_key:
                      type: string
                      minLength: 1
                    mime_type:
                      type: string
                      enum: ['application/pdf', 'application/x.scratch.sb3', 'application/x.makecode.hex']
                      description: >-
                        Canonical lowercase MIME type. Compared
                        case-insensitively by the server.
                    size_bytes:
                      type: integer
                      minimum: 1
                      maximum: 10485760
                    sha256:
                      type: string
                      pattern: '^[0-9a-f]{64}$'
                - type: object
                  required: [kind, score_raw, score_max]
                  properties:
                    intent:
                      type: string
                      enum: [feedback, submit]
                      default: submit
                      description: Optional compatibility field. Omitted requests are treated as `submit`.
                    kind:
                      type: string
                      enum: [h5p]
                    score_raw:
                      type: integer
                      minimum: 0
                    score_max:
                      type: integer
                      minimum: 0
      responses:
        '202':
          description: Submission accepted; analysis scheduled asynchronously (default response).
          headers:
            Cache-Control:
              description: Security — responses are private and not cacheable by shared caches.
              schema:
                type: string
                example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningSubmission'
        '201':
          description: Submission completed synchronously (H5P submissions only).
          headers:
            Cache-Control:
              description: Security — responses are private and not cacheable by shared caches.
              schema:
                type: string
                example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningSubmission'
        '400':
          description: >-
            Bad request (invalid_input | invalid_image_payload | invalid_file_payload | invalid_h5p_payload |
            invalid_sb3_archive | missing_project_json | invalid_hex_file | missing_makecode_source |
            makecode_source_too_large | max_attempts_exceeded | invalid_uuid)
          headers:
            Cache-Control:
              description: Security — responses are private and not cacheable by shared caches.
              schema:
                type: string
                example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          headers:
            Cache-Control:
              description: Security — responses are private and not cacheable by shared caches.
              schema:
                type: string
                example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden (not enrolled or CSRF same-origin check failed)
          headers:
            Cache-Control:
              description: Security — responses are private and not cacheable by shared caches.
              schema:
                type: string
                example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          headers:
            Cache-Control:
              description: Security — responses are private and not cacheable by shared caches.
              schema:
                type: string
                example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: >-
            Service unavailable (submission_persistence_unavailable |
            submission_validation_unavailable | sb3_validation_unavailable | hex_validation_unavailable)
          headers:
            Cache-Control:
              description: Security — responses are private and not cacheable by shared caches.
              schema:
                type: string
                example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-gustav-notes:
        - Default response is 202 pending; 201 is best-effort and MUST NOT be relied upon by clients.

  /api/learning/courses/{course_id}/tasks/{task_id}/submissions/finalize:
    post:
      tags: [Learning]
      summary: Finalize the learner's latest reviewed draft for a task
      description: >-
