  /api/teaching/courses/{course_id}/units/{unit_id}/submissions/summary:
    get:
      tags: [Teaching]
      summary: Live overview per unit (owner)
      description: Returns unit tasks and student rows with minimal per-cell status `has_submission` (true/false). No content previews.
      operationId: getTeachingUnitLiveSummary
      security:
        - cookieAuth: []
      x-permissions:
        requiredRole: teacher
        ownerOnly: true
      x-security-notes:
        - "RLS: ownership enforced; unit must be assigned to the course."
        - "Cache: private, no-store; Vary: Origin."
      parameters:
        - in: path
          name: course_id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: unit_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: updated_since
          required: false
          schema: { type: string, format: date-time }
          description: Optional ISO timestamp; reserved for future incremental behaviour (use `/submissions/delta` for polling).
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
          description: Maximum number of student rows.
        - in: query
          name: offset
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
          description: Offset into the course members list.
        - in: query
          name: include_students
          required: false
          schema: { type: boolean, default: true }
          description: Optional; when false, omit `rows` and return only the task list.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: Security — responses are private and must not be stored.
              schema:
                type: string
                example: private, no-store
            Vary:
              description: Security — responses vary by Origin
              schema:
                type: string
                example: Origin
          content:
            application/json:
              schema:
                type: object
                required: [tasks, rows]
                properties:
                  tasks:
                    type: array
                    items:
                      type: object
                      required: [id, instruction_md, position, kind]
                      additionalProperties: false
                      properties:
                        id: { type: string, format: uuid }
                        instruction_md: { type: string, description: Task instruction (Markdown) }
                        position: { type: integer }
                        kind:
                          type: string
                          enum: [native, h5p, visual, scratch, calliope]
                          description: Backend task type identifier.
                  rows:
                    type: array
                    items:
                      $ref: '#/components/schemas/TeachingUnitLiveRow'
        '400':
          description: Invalid identifiers or timestamp
          headers:
            Cache-Control: { description: Security — private, no-store, schema: { type: string, example: private, no-store } }
            Vary: { description: Security — responses vary by Origin, schema: { type: string, example: Origin } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          headers:
            Cache-Control: { description: Security — private, no-store, schema: { type: string, example: private, no-store } }
            Vary: { description: Security — responses vary by Origin, schema: { type: string, example: Origin } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden (not owner)
          headers:
            Cache-Control: { description: Security — private, no-store, schema: { type: string, example: private, no-store } }
            Vary: { description: Security — responses vary by Origin, schema: { type: string, example: Origin } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found (course or unit not found, or unit does not belong to the course)
          headers:
            Cache-Control: { description: Security — private, no-store, schema: { type: string, example: private, no-store } }
            Vary: { description: Security — responses vary by Origin, schema: { type: string, example: Origin } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/teaching/courses/{course_id}/units/{unit_id}/submissions/delta:
    get:
      tags: [Teaching]
      summary: Live overview delta per unit (owner)
      description: Returns changed submission cells since the provided timestamp. Designed for polling in the classroom view.
      operationId: getTeachingUnitLiveDelta
      security:
        - cookieAuth: []
      x-permissions:
        requiredRole: teacher
        ownerOnly: true
      x-security-notes:
        - "RLS: ownership enforced; unit must belong to the course."
        - "Cache: private, no-store; Vary: Origin."
      parameters:
        - in: path
          name: course_id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: unit_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: updated_since
          required: true
          schema: { type: string, format: date-time }
          description: ISO timestamp (exclusive). Only cells changed after this instant are returned.
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
          description: Maximum number of cells returned.
        - in: query
          name: offset
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
          description: Offset into the changeset; primarily for pagination in large classes.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: Security — responses are private and must not be stored.
              schema:
                type: string
                example: private, no-store
            Vary:
              description: Security — responses vary by Origin
              schema:
                type: string
                example: Origin
          content:
            application/json:
              schema:
                type: object
                required: [cells]
                properties:
                  cells:
                    type: array
                    description: Changed submission cells since the provided timestamp.
                    items:
                      $ref: '#/components/schemas/TeachingUnitDeltaCell'
        '204':
          description: No changes since `updated_since`
          headers:
            Cache-Control: { description: Security — private, no-store, schema: { type: string, example: private, no-store } }
            Vary: { description: Security — responses vary by Origin, schema: { type: string, example: Origin } }
        '400':
          description: Invalid identifiers or timestamp
          headers:
            Cache-Control: { description: Security — private, no-store, schema: { type: string, example: private, no-store } }
            Vary: { description: Security — responses vary by Origin, schema: { type: string, example: Origin } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': { $ref: '#/components/responses/Unauthorized401' }
        '403': { description: Forbidden (not owner), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not found (course or unit not found, or unit ist nicht Teil des Kurses), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/teaching/courses/{course_id}/students/{student_sub}/submissions/overview:
    get:
      tags: [Teaching]
      summary: Live overview for one student across course units (owner)
      description: Returns all selected course units with their tasks and the latest teacher-visible submission status for one student.
      operationId: getTeachingStudentLiveOverview
      security:
        - cookieAuth: []
      x-permissions:
        requiredRole: teacher
        ownerOnly: true
      parameters:
        - in: path
          name: course_id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: student_sub
          required: true
          schema: { type: string }
          description: >
            Student subject identifier. Clients must URL-encode reserved path
            characters; the server accepts encoded slash-containing values.
        - in: query
          name: unit_ids
          required: false
          allowEmptyValue: true
          style: form
          explode: true
          schema:
            type: array
            maxItems: 50
            items:
              type: string
              format: uuid
          description: >
            Optional list of unit ids. When omitted, all units attached to the
            course are returned. Duplicate values are ignored by the server.
            Sending only blank values such as `unit_ids=` expresses an explicit
            empty selection and returns zero units.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: Security — responses are private and must not be stored.
              schema:
                type: string
                example: private, no-store
            Vary:
              description: Security — responses vary by Origin
              schema:
                type: string
                example: Origin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachingStudentLiveOverview'
        '400':
          description: Invalid identifiers or too many unit ids
          headers:
            Cache-Control: { description: Security — private, no-store, schema: { type: string, example: private, no-store } }
            Vary: { description: Security — responses vary by Origin, schema: { type: string, example: Origin } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          headers:
            Cache-Control: { description: Security — private, no-store, schema: { type: string, example: private, no-store } }
            Vary: { description: Security — responses vary by Origin, schema: { type: string, example: Origin } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden (not owner)
          headers:
            Cache-Control: { description: Security — private, no-store, schema: { type: string, example: private, no-store } }
            Vary: { description: Security — responses vary by Origin, schema: { type: string, example: Origin } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Student not enrolled in the course, or requested unit not attached to the course
          headers:
            Cache-Control: { description: Security — private, no-store, schema: { type: string, example: private, no-store } }
            Vary: { description: Security — responses vary by Origin, schema: { type: string, example: Origin } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
