                  type: string
      responses:
        '201':
          description: Added
          headers:
            Cache-Control:
              description: Security — responses are private and not cacheable by shared caches.
              schema:
                type: string
                example: private, no-store
        '204':
          description: Already a member (no content)
          headers:
            Cache-Control:
              description: Security — responses are private and not cacheable by shared caches.
