  /api/learning/internal/upload-proxy:
    x-internal: true
    put:
      tags: [Learning]
      summary: Proxy presigned upload via same-origin endpoint (student-only)
      description: >-
        Forwards the request body to a presigned storage URL (usually Supabase Storage) while keeping
        browser uploads on the same origin. Returns the computed `sha256` and `size_bytes` so the student
        can finalize the submission payload. Structured telemetry is emitted for observability
        (success/error volume). No additional rate-limiting or throttling is applied.
      x-security-notes:
        - "CSRF: Same-origin required (Origin/Referer must match server origin)."
        - "Host validation: Query param `url` must match the SUPABASE_URL or SUPABASE_PUBLIC_URL host (prevents SSRF/rewrites)."
        - "HTTP uploads are only accepted for localhost-style hosts (localhost/127.0.0.0/8/::1/host.docker.internal)."
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: url
          required: true
          schema:
            type: string
            format: uri
          description: >-
            Absolute presigned HTTPS URL returned by the upload-intents endpoint (host must equal SUPABASE_URL or SUPABASE_PUBLIC_URL;
            HTTP is only accepted for localhost-style hosts).
        - in: query
          name: headers
          required: false
          schema:
            type: string
