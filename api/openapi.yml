    Material:
      type: object
      required: [id, unit_id, section_id, title, body_md, position, kind, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        unit_id:
          type: string
          format: uuid
        section_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        position:
