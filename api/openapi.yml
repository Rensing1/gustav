          $ref: '#/components/schemas/H5PTaskConfig'
          nullable: true
        visual:
          $ref: '#/components/schemas/VisualTaskConfig'
          nullable: true
        scratch:
          $ref: '#/components/schemas/ScratchTaskConfig'
          nullable: true
        calliope:
          $ref: '#/components/schemas/CalliopeTaskConfig'
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TaskCreate:
      type: object
      required: [instruction_md]
