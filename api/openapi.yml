        - "Data minimisation: only score raw/max are forwarded to Learning."
      parameters:
        - in: query
          name: course_id
          required: false
          schema:
            type: string
            format: uuid
          description: Optional course scope for forwarding a learning submission.
        - in: query
          name: task_id
          required: false
          schema:
            type: string
            format: uuid
          description: Optional task scope for forwarding a learning submission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required: [contentId, score, maxScore]
              properties:
                contentId:
                  type: string
                  description: H5P content id.
                score:
                  type: number
                maxScore:
                  type: number
                opened:
                  type: string
                  nullable: true
                finished:
                  type: string
                  nullable: true
                time:
                  type: number
                  nullable: true
      responses:
        '200':
          description: Finished state persisted
          headers:
            Cache-Control:
              description: Security — responses are private and not cacheable by shared caches.
              schema:
                type: string
                example: private, no-store
            Vary:
              description: Security — responses vary by Origin
              schema:
                type: string
                example: Origin
          content:
            application/json:
              schema:
                type: object
                required: [success]
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Invalid request
          headers:
            Cache-Control: { description: Security — private, no-store, schema: { type: string, example: private, no-store } }
            Vary: { description: Security — responses vary by Origin, schema: { type: string, example: Origin } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          description: Forbidden (csrf_violation)
          headers:
            Cache-Control: { description: Security — private, no-store, schema: { type: string, example: private, no-store } }
            Vary: { description: Security — responses vary by Origin, schema: { type: string, example: Origin } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          headers:
            Cache-Control: { description: Security — private, no-store, schema: { type: string, example: private, no-store } }
            Vary: { description: Security — responses vary by Origin, schema: { type: string, example: Origin } }
          content:
