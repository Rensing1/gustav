        completed `intent=feedback` submission for the same task. This path does
        not enqueue a new worker or trigger another feedback run.
      operationId: finalizeLearningSubmission
      security:
        - cookieAuth: []
      x-security-notes:
        - "CSRF: Same-origin required for browser-triggered requests (Origin/Referer must match server origin)."
        - "RLS: learner ownership, course membership and draft visibility are enforced by backend helpers."
      parameters:
        - in: path
          name: course_id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: task_id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            maxLength: 64
            pattern: '^[A-Za-z0-9_-]{1,64}$'
      requestBody:
