          $ref: '#/components/schemas/SessionBootstrapUser'
        unit:
          $ref: '#/components/schemas/TeacherUnitWorkspaceUnit'
        node:
          $ref: '#/components/schemas/TeacherUnitNodeEditorNode'
        materials:
          type: array
          items:
            $ref: '#/components/schemas/TeacherUnitNodeEditorMaterial'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TeacherUnitNodeEditorTask'
        settings:
          $ref: '#/components/schemas/TeacherUnitNodeEditorSettings'
    DiagnosticsCourseMatrixCourse:
      type: object
      required: [id, title, href]
      properties:
        id:
          type: string
        title:
          type: string
        href:
          type: string
    DiagnosticsCourseMatrixUnit:
      type: object
      required: [id, title, position, href]
      properties:
        id:
          type: string
        title:
          type: string
        position:
          type: integer
        href:
          type: string
    DiagnosticsCourseMatrixStudent:
      type: object
      required: [sub, name, href]
      properties:
        sub:
          type: string
        name:
          type: string
        href:
          type: string
    DiagnosticsCourseMatrixCell:
      type: object
      required: [unit_id, submitted_tasks, total_tasks, href]
      properties:
        unit_id:
          type: string
        submitted_tasks:
          type: integer
        total_tasks:
          type: integer
        href:
          type: string
    DiagnosticsCourseMatrixRow:
      type: object
      required: [student, cells]
      properties:
        student:
          $ref: '#/components/schemas/DiagnosticsCourseMatrixStudent'
        cells:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticsCourseMatrixCell'
    DiagnosticsCourseMatrixView:
      type: object
      required: [user, course, units, rows]
      properties:
        user:
          $ref: '#/components/schemas/SessionBootstrapUser'
        course:
          $ref: '#/components/schemas/DiagnosticsCourseMatrixCourse'
        units:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticsCourseMatrixUnit'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticsCourseMatrixRow'
    DiagnosticsLearnerProfileLearner:
      type: object
      required: [sub, name, href]
      properties:
        sub:
          type: string
        name:
          type: string
        href:
          type: string
    DiagnosticsLearnerProfileSummary:
      type: object
      required: [courses_count, submitted_tasks, total_tasks]
      properties:
        courses_count:
          type: integer
        submitted_tasks:
          type: integer
        total_tasks:
          type: integer
    DiagnosticsLearnerProfileUnit:
      type: object
      required: [id, title, position, href, submitted_tasks, total_tasks]
      properties:
        id:
          type: string
        title:
          type: string
        position:
          type: integer
        href:
          type: string
        submitted_tasks:
          type: integer
        total_tasks:
          type: integer
    DiagnosticsLearnerProfileCourse:
      type: object
      required: [id, title, href, submitted_tasks, total_tasks, units]
      properties:
        id:
          type: string
        title:
          type: string
        href:
          type: string
        submitted_tasks:
          type: integer
        total_tasks:
          type: integer
        units:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticsLearnerProfileUnit'
    DiagnosticsLearnerProfileView:
      type: object
      required: [user, learner, summary, courses]
      properties:
        user:
          $ref: '#/components/schemas/SessionBootstrapUser'
        learner:
          $ref: '#/components/schemas/DiagnosticsLearnerProfileLearner'
        summary:
          $ref: '#/components/schemas/DiagnosticsLearnerProfileSummary'
        courses:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticsLearnerProfileCourse'
    LiveCourseRef:
      type: object
      required: [id, title, href]
      properties:
        id:
          type: string
        title:
          type: string
        href:
          type: string
    LiveUnitRef:
      type: object
      required: [id, title, position, href]
      properties:
        id:
          type: string
        title:
          type: string
        position:
          type: integer
        href:
          type: string
    LiveTask:
      type: object
      required: [id, instruction_md, position, kind]
      properties:
        id:
          type: string
        instruction_md:
          type: string
        position:
          type: integer
        kind:
          type: string
    LiveMatrixStudent:
      type: object
      required: [sub, name, href]
      properties:
        sub:
          type: string
        name:
          type: string
        href:
          type: string
    LiveMatrixCell:
      type: object
      required: [task_id, has_submission, href]
      properties:
        task_id:
          type: string
        has_submission:
          type: boolean
        average_score:
          type: number
          nullable: true
        score_raw:
          type: integer
          nullable: true
        score_max:
          type: integer
          nullable: true
        h5p_completed:
          type: boolean
          nullable: true
        href:
          type: string
    LiveMatrixRow:
      type: object
      required: [student, tasks]
      properties:
        student:
          $ref: '#/components/schemas/LiveMatrixStudent'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/LiveMatrixCell'
    LiveUnitMatrixView:
      type: object
      required: [user, course, unit, tasks, rows]
      properties:
        user:
          $ref: '#/components/schemas/SessionBootstrapUser'
        course:
          $ref: '#/components/schemas/LiveCourseRef'
        unit:
          $ref: '#/components/schemas/LiveUnitRef'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/LiveTask'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/LiveMatrixRow'
    LiveDetailStudent:
      type: object
      required: [sub, name, href]
      properties:
        sub:
          type: string
        name:
          type: string
        href:
          type: string
    LiveDetailTask:
