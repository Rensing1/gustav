openapi: 3.0.3
info:
  title: GUSTAV API
  version: 0.0.2
  description: >-
    Contract-first API for authentication (Keycloak), Teaching, and Learning.
    Endpoints cover login redirect, callback handling, logout, session info,
    course/unit/section/task/material management for teachers, and student
    views for released content. Sessions are represented by an httpOnly cookie.
  x-changelog:
    - date: "2025-10-28"
      type: breaking
      note: "LearningSectionCore now requires unit_id (update client models)."

servers:
  - url: /

# All endpoints require an authenticated session by default.
# Public endpoints explicitly override with `security: []` at operation level.
security:
  - cookieAuth: []

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: gustav_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized401:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            default:
              value: { error: "unauthorized" }
    Forbidden403:
      description: Insufficient permissions for the requested resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            default:
              value: { error: "forbidden" }
  schemas:
    Role:
      type: string
      enum: [student, teacher, admin]
    Me:
      type: object
      required: [sub, roles, name, expires_at]
      properties:
        sub:
          type: string
          description: Stable subject identifier from the IdP (opaque, non-PII).
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        name:
          type: string
          description: Display name (prefer Keycloak user attribute `display_name`; fallback per server logic).
        expires_at:
          type: string
          format: date-time
          description: Session expiration timestamp (UTC ISO-8601).
          nullable: true
      example:
        sub: "a1b2c3d4-ef01-2345-6789-abcdef012345"
        roles: ["student"]
        name: "Max Musterschüler"
        expires_at: "2025-10-20T12:34:56+00:00"
    SessionBootstrapUser:
      type: object
      required: [sub, name, role, roles]
      properties:
        sub:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    SessionBootstrap:
      type: object
      required: [user, start_target, spaces]
      properties:
        user:
          $ref: '#/components/schemas/SessionBootstrapUser'
        start_target:
          type: string
          enum: ["/learning", "/teaching"]
          description: Initial in-app destination derived from the current role.
        spaces:
          type: array
          description: Top-level product spaces the shell should expose for the current role.
          items:
            type: string
      example:
        user:
          sub: "teacher-123"
          name: "Ada"
          role: "teacher"
          roles: ["teacher"]
        start_target: "/teaching"
        spaces: ["teaching", "diagnostics", "live"]
    AppProfileView:
      type: object
      required: [user, display_name, email, first_name, last_name, name_locked_until, name_can_edit, password_change_href]
      properties:
        user:
          $ref: '#/components/schemas/SessionBootstrapUser'
        display_name:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        name_locked_until:
          type: string
          format: date-time
          nullable: true
        name_can_edit:
          type: boolean
        password_change_href:
          type: string
    ProfileDisplayNameUpdate:
      type: object
      required: [display_name]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
    ProfileNameUpdate:
      type: object
      required: [first_name, last_name]
      properties:
        first_name:
          type: string
          maxLength: 80
        last_name:
          type: string
          maxLength: 80
    LearnerHomeCourse:
      type: object
      required: [id, title, href]
      properties:
        id:
          type: string
        title:
          type: string
        href:
          type: string
    LearnerHome:
      type: object
      required: [user, courses]
      properties:
        user:
          $ref: '#/components/schemas/SessionBootstrapUser'
        courses:
          type: array
          items:
            $ref: '#/components/schemas/LearnerHomeCourse'
    ConcernBoxCourseOption:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
        title:
          type: string
    LearnerConcernBoxView:
      type: object
      required: [user, courses]
      properties:
        user:
          $ref: '#/components/schemas/SessionBootstrapUser'
        courses:
          type: array
          items:
            $ref: '#/components/schemas/ConcernBoxCourseOption'
    ConcernBoxEntryCreate:
      type: object
      required: [course_id, message_text, anonymous]
      properties:
        course_id:
          type: string
        message_text:
          type: string
          minLength: 1
        anonymous:
          type: boolean
      example:
        course_id: "course-1"
        message_text: "Mehr Zeit für Rückfragen am Stundenende wäre hilfreich."
        anonymous: true
    ConcernBoxEntryCreated:
      type: object
      required: [id, created_at]
      properties:
        id:
          type: string
        created_at:
          type: string
          format: date-time
    TeacherHomeEntry:
      type: object
      required: [id, title, href, description]
      properties:
        id:
          type: string
        title:
          type: string
        href:
          type: string
        description:
          type: string
    TeacherHome:
      type: object
      required: [user, entries]
      properties:
        user:
          $ref: '#/components/schemas/SessionBootstrapUser'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/TeacherHomeEntry'
    TeacherCourseListItem:
      type: object
      required: [id, title, href, members_count, units_count]
      properties:
        id:
          type: string
        title:
          type: string
        href:
          type: string
        members_count:
          type: integer
          minimum: 0
        units_count:
          type: integer
          minimum: 0
        subject:
          type: string
          nullable: true
        grade_level:
          type: string
          nullable: true
        term:
          type: string
          nullable: true
    TeacherCourseListView:
      type: object
      required: [user, courses]
      properties:
        user:
          $ref: '#/components/schemas/SessionBootstrapUser'
        courses:
          type: array
          items:
            $ref: '#/components/schemas/TeacherCourseListItem'
    TeacherCourseContextCourse:
      type: object
      required: [id, title, href, members_href, diagnostics_href, members_count, units_count]
      properties:
        id:
          type: string
        title:
          type: string
        href:
          type: string
        members_href:
          type: string
        diagnostics_href:
          type: string
        members_count:
          type: integer
        units_count:
          type: integer
    TeacherCourseContextUnit:
      type: object
      required: [id, title, position, href]
      properties:
        id:
          type: string
        title:
          type: string
        position:
          type: integer
        href:
          type: string
    TeacherCourseContextMember:
      type: object
      required: [sub, name, href, joined_at]
      properties:
        sub:
          type: string
        name:
          type: string
        href:
          type: string
        joined_at:
          type: string
    TeacherCourseContextView:
      type: object
      required: [user, course, units, members]
      properties:
        user:
          $ref: '#/components/schemas/SessionBootstrapUser'
        course:
          $ref: '#/components/schemas/TeacherCourseContextCourse'
        units:
          type: array
          items:
            $ref: '#/components/schemas/TeacherCourseContextUnit'
        members:
          type: array
          items:
            $ref: '#/components/schemas/TeacherCourseContextMember'
    TeacherConcernBoxFilterOption:
      type: object
      required: [id, label, active]
      properties:
        id:
          type: string
          enum: [open, archived]
        label:
          type: string
        active:
          type: boolean
    TeacherConcernBoxEntry:
      type: object
      required: [id, course_id, course_title, message_text, anonymous, created_at]
      properties:
        id:
          type: string
        course_id:
          type: string
        course_title:
          type: string
        message_text:
          type: string
        anonymous:
          type: boolean
        student_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
          nullable: true
    TeacherConcernBoxView:
      type: object
      required: [user, scopes, active_scope, entries]
      properties:
        user:
          $ref: '#/components/schemas/SessionBootstrapUser'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/TeacherConcernBoxFilterOption'
        active_scope:
          type: string
          enum: [open, archived]
        entries:
          type: array
          items:
            $ref: '#/components/schemas/TeacherConcernBoxEntry'
    TeacherUnitsCatalogCourse:
      type: object
      required: [id, title, href]
      properties:
        id:
          type: string
        title:
          type: string
        href:
          type: string
    TeacherUnitsCatalogItem:
      type: object
      required: [id, title, status_label, status_tone, courses_count, courses, updated_at, href]
      properties:
        id:
          type: string
        title:
          type: string
        topic:
          type: string
          nullable: true
        status_label:
          type: string
        status_tone:
          type: string
          enum: [accent, success, muted]
        courses_count:
          type: integer
          minimum: 0
        courses:
          type: array
          items:
            $ref: '#/components/schemas/TeacherUnitsCatalogCourse'
        updated_at:
          type: string
        href:
          type: string
    TeacherUnitsCatalogView:
      type: object
      required: [user, query, sort, result_count, items, create_href]
      properties:
        user:
          $ref: '#/components/schemas/SessionBootstrapUser'
        query:
          type: string
        sort:
          type: string
        result_count:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeacherUnitsCatalogItem'
        create_href:
          type: string
    TeacherUnitWorkspaceUnit:
      type: object
      required: [id, title, unit_type, edit_href]
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
          nullable: true
        unit_type:
          type: string
          enum: [linear, modular]
        edit_href:
          type: string
    TeacherUnitWorkspaceCounts:
      type: object
      required: [sections_count, phases_count, modules_count, courses_count]
      properties:
        sections_count:
          type: integer
          minimum: 0
        phases_count:
          type: integer
          minimum: 0
        modules_count:
          type: integer
          minimum: 0
        courses_count:
          type: integer
          minimum: 0
    TeacherUnitWorkspaceSectionItem:
      type: object
      required: [id, title, position, materials_count, tasks_count, editor_href]
      properties:
        id:
          type: string
        title:
          type: string
        position:
          type: integer
          minimum: 1
        materials_count:
          type: integer
          minimum: 0
        tasks_count:
          type: integer
          minimum: 0
        editor_href:
          type: string
    TeacherUnitWorkspacePhaseItem:
      type: object
      required: [id, title, position]
      properties:
        id:
          type: string
        title:
          type: string
        position:
          type: integer
          minimum: 1
    TeacherUnitWorkspaceModuleItem:
      type: object
      required: [id, title, phase_id, position_in_phase, required_prereq_count, materials_count, tasks_count, editor_href]
      properties:
        id:
          type: string
        title:
          type: string
        phase_id:
          type: string
        position_in_phase:
          type: integer
          minimum: 1
        required_prereq_count:
          type: integer
          minimum: 0
        materials_count:
          type: integer
          minimum: 0
        tasks_count:
          type: integer
          minimum: 0
        editor_href:
          type: string
        section_id:
          type: string
          nullable: true
    TeacherUnitWorkspaceEdge:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
        to:
          type: string
    TeacherUnitNodeEditorMaterial:
      type: object
      required: [id, title, kind, position]
      properties:
        id:
          type: string
        title:
          type: string
        kind:
          type: string
          enum: [markdown, file]
        body_md:
          type: string
          nullable: true
        position:
          type: integer
          minimum: 1
        mime_type:
          type: string
          nullable: true
        size_bytes:
          type: integer
          nullable: true
        filename_original:
          type: string
          nullable: true
        alt_text:
          type: string
          nullable: true
    TeacherUnitNodeEditorTask:
      type: object
      required: [id, instruction_md, criteria, kind, position]
      properties:
        id:
          type: string
        instruction_md:
          type: string
        criteria:
          type: array
          items:
            type: string
        teacher_context_md:
          type: string
          nullable: true
        due_at:
          type: string
          format: date-time
          nullable: true
        max_attempts:
          type: integer
          minimum: 1
          nullable: true
        position:
          type: integer
          minimum: 1
        kind:
          type: string
          enum: [native, h5p, visual, scratch, calliope]
        h5p:
          $ref: '#/components/schemas/H5PTaskConfig'
          nullable: true
        visual:
          $ref: '#/components/schemas/VisualTaskConfig'
          nullable: true
        scratch:
          $ref: '#/components/schemas/ScratchTaskConfig'
          nullable: true
        calliope:
          $ref: '#/components/schemas/CalliopeTaskConfig'
          nullable: true
    TeacherUnitWorkspaceSelectionSection:
      type: object
      required: [id, title, position, editor_href]
      properties:
        id:
          type: string
        title:
          type: string
        position:
          type: integer
          minimum: 1
        editor_href:
          type: string
    TeacherUnitWorkspaceSelectionPhase:
      type: object
      required: [id, title, position]
      properties:
        id:
          type: string
        title:
          type: string
        position:
          type: integer
          minimum: 0
    TeacherUnitWorkspaceSelectionModule:
      type: object
      required: [id, title, phase_id, position_in_phase, required_prereq_count, materials_count, tasks_count, editor_href]
      properties:
        id:
          type: string
        title:
          type: string
        phase_id:
          type: string
        position_in_phase:
          type: integer
          minimum: 1
        required_prereq_count:
          type: integer
          minimum: 0
        materials_count:
          type: integer
          minimum: 0
        tasks_count:
          type: integer
          minimum: 0
        editor_href:
          type: string
    TeacherUnitWorkspaceGraphPhase:
      type: object
      required: [id, title, position, modules]
      properties:
        id:
          type: string
        title:
          type: string
        position:
          type: integer
          minimum: 1
        modules:
          type: array
          items:
            $ref: '#/components/schemas/TeacherUnitWorkspaceModuleItem'
    TeacherUnitWorkspaceEdgeSelection:
      type: object
      required: [from_id, to_id, from_title, to_title, exists]
      properties:
        from_id:
          type: string
        to_id:
          type: string
        from_title:
          type: string
        to_title:
          type: string
        exists:
          type: boolean
    TeacherUnitWorkspaceSelection:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [none, section, phase, module, edge]
        section:
          allOf:
            - $ref: '#/components/schemas/TeacherUnitWorkspaceSelectionSection'
          nullable: true
        phase:
          allOf:
            - $ref: '#/components/schemas/TeacherUnitWorkspaceSelectionPhase'
          nullable: true
        module:
          allOf:
            - $ref: '#/components/schemas/TeacherUnitWorkspaceSelectionModule'
          nullable: true
        edge:
          allOf:
            - $ref: '#/components/schemas/TeacherUnitWorkspaceEdgeSelection'
          nullable: true
    TeacherUnitWorkspaceGraph:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [linear, modular]
        create_section_href:
          type: string
          nullable: true
        create_phase_href:
          type: string
          nullable: true
        create_module_href:
          type: string
          nullable: true
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/TeacherUnitWorkspaceSectionItem'
        phases:
          type: array
          items:
            $ref: '#/components/schemas/TeacherUnitWorkspaceGraphPhase'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/TeacherUnitWorkspaceEdge'
    TeacherUnitWorkspaceView:
      type: object
      required: [user, unit, counts, graph, selection]
      properties:
        user:
          $ref: '#/components/schemas/SessionBootstrapUser'
        unit:
          $ref: '#/components/schemas/TeacherUnitWorkspaceUnit'
        counts:
          $ref: '#/components/schemas/TeacherUnitWorkspaceCounts'
        graph:
          $ref: '#/components/schemas/TeacherUnitWorkspaceGraph'
        selection:
          $ref: '#/components/schemas/TeacherUnitWorkspaceSelection'
    TeacherUnitNodeEditorNode:
      type: object
      required: [id, kind, title, editor_title]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [section, module]
        title:
          type: string
        editor_title:
          type: string
        backing_section_id:
          type: string
          nullable: true
    TeacherUnitNodeEditorSettings:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [section, module]
        required_prereq_count:
          type: integer
          minimum: 0
          nullable: true
    TeacherUnitNodeEditorView:
      type: object
      required: [user, unit, node, materials, tasks, settings]
