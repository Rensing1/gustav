              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    get:
      tags: [Auth]
      summary: Redirect to IdP login (Authorization Code Flow with PKCE)
      description: >-
        Redirects to the Keycloak authorization endpoint with PKCE. The server
        generates and manages the opaque `state` (CSRF) and a `nonce` (replay
        protection) for the OIDC flow; clients MUST NOT provide these values.
      operationId: startLogin
      security: []
      parameters:
        - in: query
          name: redirect
          schema:
            type: string
            maxLength: 256
            pattern: '^(?!.*//)(?!.*\.\.)/[A-Za-z0-9._\-/]*$'
          description: >-
            Optional in-app absolute path to navigate to after login. External
            URLs are rejected; invalid values are ignored. Disallows double-slash
            and path traversal segments.
      responses:
        '204':
          description: HTMX request — instruct the browser to redirect via header
          headers:
            Cache-Control:
              description: Security — responses must not be cached.
              schema:
                type: string
              example: private, no-store
            Vary:
              description: Ensure caches vary on HTMX usage
              schema:
                type: string
              example: HX-Request
            HX-Redirect:
              description: Target authorization URL for client-side redirect
              schema:
                type: string
        '302':
          description: Redirect to Keycloak authorization endpoint
          headers:
            Cache-Control:
              description: Security — responses must not be cached.
              schema:
                type: string
              example: private, no-store
            Vary:
              description: Ensure caches vary on HTMX usage
              schema:
                type: string
              example: HX-Request
            Location:
              description: Authorization URL at Keycloak
              schema:
                type: string
        '400':
          description: Invalid or expired request (e.g., stale state)
          headers:
            Cache-Control:
              description: Security — responses must not be cached.
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        


  /auth/callback:
    get:
      tags: [Auth]
      summary: OAuth2/OIDC callback from Keycloak
      description: Handles the authorization code, sets session cookie, and redirects.
      operationId: authCallback
      security: []
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
        - in: query
          name: state
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Session established, redirect to application page
          headers:
            Cache-Control:
              description: Security — responses must not be cached.
              schema:
                type: string
              example: private, no-store
            Set-Cookie:
              description: >-
                httpOnly session cookie `gustav_session`.
                All environments: `HttpOnly; Secure; SameSite=lax` (OAuth/OIDC‑kompatibel),
                ohne `Domain`‑Attribut (host‑only cookie).
                In production, `Max-Age` matches the server session TTL (default 3600 seconds).
              schema:
                type: string
            Location:
              description: In-app destination (e.g., "/" or a course page)
              schema:
                type: string
        '400':
          description: Invalid or expired code/state
          headers:
            Cache-Control:
              description: Security — responses must not be cached.
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    get:
      tags: [Auth]
      summary: Logout (App session + IdP end-session)
      description: >-
        Clears the application session cookie and redirects to the Identity Provider's
        end-session endpoint. After IdP logout, the browser returns to the app start page.
      operationId: logoutUnified
      security: []
      parameters:
        - in: query
          name: redirect
          required: false
          schema:
            type: string
            maxLength: 256
            pattern: '^(?!.*//)(?!.*\.\.)/[A-Za-z0-9._\-/]*$'
            default: "/auth/logout/success"
          description: >-
            App-relative absolute path (e.g., "/courses") to redirect to after IdP logout.
            External URLs are rejected and ignored. Disallows double-slash and path traversal.
            Defaults to "/auth/logout/success". Server enforces the same regex pattern.
      responses:
        '302':
          description: Redirect to IdP end-session endpoint (then back to the app)
          headers:
            Cache-Control:
              description: Security — responses must not be cached.
              schema:
                type: string
              example: private, no-store
            Set-Cookie:
              description: >-
                Clears the httpOnly session cookie `gustav_session` (expires it).
                All environments: `HttpOnly; Secure; SameSite=lax; Max-Age=0`,
                ohne `Domain`‑Attribut (host‑only cookie).
              schema:
                type: string
            Location:
              description: IdP end-session endpoint URL
              schema:
                type: string

  /auth/logout/success:
    get:
      tags: [Auth]
      summary: Logout success page
      description: Shows a confirmation that the user has been logged out and links to /auth/login.
      security: []
      responses:
        '200':
          description: HTML page confirming logout
          headers:
            Cache-Control:
              description: Security — responses must not be cached.
              schema:
                type: string
              example: private, no-store
          content:
            text/html:
              schema:
                type: string


  /auth/forgot:
    get:
      tags: [Auth]
      summary: Redirect to IdP forgot password page
      description: >-
        Redirect to the Keycloak password reset page. GUSTAV does not send
        password reset emails itself; the Identity Provider (Keycloak) is
        responsible for email delivery and rate limiting.
      operationId: forgotPassword
      security: []
      parameters:
        - in: query
          name: login_hint
          schema:
            type: string
            format: email
          description: Optional email to prefill on the reset page.
      responses:
        '302':
          description: Redirect to Keycloak password reset page
          headers:
            Cache-Control:
              description: Security — responses are private and not cacheable by shared caches.
              schema:
                type: string
              example: private, no-store
            Vary:
              description: Ensure caches vary on HTMX usage
              schema:
                type: string
              example: HX-Request
            Location:
              schema:
                type: string

  /auth/password:
    get:
      tags: [Auth]
      summary: Redirect to IdP password update page
      description: >-
        Redirects to Keycloak with `kc_action=UPDATE_PASSWORD` so the current
        user can change the account password in the Identity Provider.
      operationId: startPasswordChange
      security: []
      parameters:
        - in: query
          name: redirect
          schema:
            type: string
            maxLength: 256
            pattern: '^(?!.*//)(?!.*\.\.)/[A-Za-z0-9._\-/]*$'
            default: "/profile"
          description: Optional in-app target after the password flow completes.
      responses:
        '204':
          description: HTMX request — instruct the browser to redirect via header
          headers:
            Cache-Control:
              description: Security — responses must not be cached.
              schema:
                type: string
              example: private, no-store
            Vary:
              description: Ensure caches vary on HTMX usage
              schema:
                type: string
              example: HX-Request
            HX-Redirect:
              description: Target authorization URL for client-side redirect
              schema:
                type: string
        '302':
          description: Redirect to Keycloak password update page
          headers:
            Cache-Control:
              description: Security — responses must not be cached.
              schema:
                type: string
              example: private, no-store
            Vary:
              description: Ensure caches vary on HTMX usage
              schema:
                type: string
              example: HX-Request
            Location:
              schema:
                type: string


  /auth/register:
    get:
      tags: [Auth]
      summary: Redirect to IdP registration
      description: >-
        Redirects to Keycloak with `kc_action=register`. The server generates and
        includes a `nonce` parameter (replay protection) in the authorization request,
        analogous to `/auth/login`. When `ALLOWED_REGISTRATION_DOMAINS` is configured
        in the environment, the server MAY reject `login_hint` values whose email
        domain is not on the allow-list and respond with `400` instead of redirecting.
      operationId: startRegistration
      security: []
      parameters:
        - in: query
          name: login_hint
          schema:
            type: string
            format: email
          description: Optional email to prefill in the registration form.
        - in: query
          name: redirect
          schema:
            type: string
            maxLength: 256
            pattern: '^(?!.*//)(?!.*\.\.)/[A-Za-z0-9._\-/]*$'
          description: >-
            Optional in-app absolute path to navigate to after registration.
            External URLs are rejected; invalid values are ignored. Disallows
            double-slash and path traversal segments.
      responses:
        '204':
          description: HTMX request — instruct the browser to redirect via header
          headers:
            Cache-Control:
              description: Security — responses are private and not cacheable by shared caches.
              schema:
                type: string
              example: private, no-store
            Vary:
              description: Ensure caches vary on HTMX usage
              schema:
                type: string
              example: HX-Request
            HX-Redirect:
              description: Target authorization URL for client-side redirect
              schema:
                type: string
        '302':
          description: Redirect to Keycloak registration page
          headers:
            Cache-Control:
              description: Security — responses are private and not cacheable by shared caches.
              schema:
                type: string
              example: private, no-store
            Vary:
              description: Ensure caches vary on HTMX usage
              schema:
                type: string
              example: HX-Request
            Location:
              schema:
                type: string
        '400':
          description: Invalid or disallowed registration email hint
          headers:
            Cache-Control:
              description: Security — responses are private and not cacheable by shared caches.
              schema:
                type: string
              example: private, no-store
            Vary:
              description: Ensure caches vary on HTMX usage
              schema:
                type: string
              example: HX-Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_email_domain:
                  summary: Email domain not allowed for self-service registration
                  value:
                    error: invalid_email_domain
                    detail: "Die Registrierung ist nur mit einer Schul-E-Mail-Adresse erlaubt. Erlaubte Domains: @school.example"


