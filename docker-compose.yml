services:
  caddy:
    image: caddy:2-alpine
    container_name: gustav-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - keycloak
      - h5p
    restart: unless-stopped
    networks:
      - gustav-alpha2-network
      - supabase_network_gustav-alpha2

  web:
    build: .
    container_name: gustav-alpha2
    extra_hosts:
      # Prod-like: containers must be able to reach the public TLS endpoints via the host gateway.
      # This avoids the common `*.localhost` -> 127.0.0.1 (loopback) trap inside containers.
      - "app.localhost:host-gateway"
      - "id.localhost:host-gateway"
      # Dev convenience: reach host-local inference endpoints (e.g. localhost:11434) from the container.
      - "host.docker.internal:host-gateway"
    # behind proxy; no direct host port mapping
    volumes:
      # Live-Reload: Web-Code (SSR) wird eingebunden
      - ./backend/web:/app:z
      # Identity Access layer must be mounted as well for imports
      - ./backend/identity_access:/app/identity_access:z
      # Teaching bounded context (use cases/repos)
      - ./backend/teaching:/app/teaching:z
      # Learning bounded context
      - ./backend/learning:/app/backend/learning:z
      # Vision utilities (PDF rendering, preprocessing, stitching)
      - ./backend/vision:/app/backend/vision:z
      # Shared storage helpers (learning upload policy, verification)
      - ./backend/storage:/app/backend/storage:z
      - ./backend/__init__.py:/app/backend/__init__.py:z
      # Shared dev uploads directory for vision to access uploaded files
      - ./.tmp/dev_uploads:/app/.tmp/dev_uploads:z
      # Trust Caddy's local CA inside the container for prod-like HTTPS calls.
      - ./.tmp/caddy-root.crt:/app/.tmp/caddy-root.crt:ro
    env_file:
      - .env
    environment:
      # Internal Supabase gateway (Kong) reachable via shared network
      - SUPABASE_URL=http://supabase_kong_gustav-alpha2:8000
      # Browser-facing public Supabase base (used in signed URLs)
      - SUPABASE_PUBLIC_URL=${SUPABASE_PUBLIC_URL:-https://app.localhost}
      # Same-origin proxy for Storage uploads to avoid browser CORS issues
      - ENABLE_STORAGE_UPLOAD_PROXY=false
      - GUSTAV_ENV=${GUSTAV_ENV:-dev}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      # Internal Keycloak base URL for server-to-server calls (token exchange, JWKS).
      # Do NOT set this to a *.localhost hostname inside containers: it resolves to loopback.
      - KC_BASE_URL=http://keycloak:8080
      - KC_PUBLIC_BASE_URL=${KC_PUBLIC_BASE_URL:-https://id.localhost}
      - KC_REALM=${KC_REALM:-gustav}
      - KC_CLIENT_ID=${KC_CLIENT_ID:-gustav-web}
      # Keycloak Admin API credentials for /api/users/search and name resolution
      - KC_ADMIN_USERNAME=${KC_ADMIN_USERNAME:-admin}
      - KC_ADMIN_PASSWORD=${KC_ADMIN_PASSWORD:-admin}
      # Trust the local dev CA for HTTPS calls to `https://id.localhost` (OIDC + Admin API).
      - KEYCLOAK_CA_BUNDLE=/app/.tmp/caddy-root.crt
      # Browser-facing app base controls callback host
      - WEB_BASE=${WEB_BASE:-https://app.localhost}
      - REDIRECT_URI=${WEB_BASE:-https://app.localhost}/auth/callback
      # Trust reverse-proxy headers for Same-Origin checks in CSRF logic
      - GUSTAV_TRUST_PROXY=true
      # Enable DB-backed sessions inside the container; connect to local Supabase via host gateway
      - SESSIONS_BACKEND=db
      - AUTO_CREATE_STORAGE_BUCKETS=false
      # Allow storage3 fallback in container even when using host.docker.internal
      - SUPABASE_FALLBACK_STORAGE3=true
      # App runtime DSN: build from app login user/pass and container DB host.
      - APP_DB_USER=${APP_DB_USER:-gustav_app}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:-CHANGE_ME_DEV}
      - DATABASE_URL=postgresql://${APP_DB_USER:-gustav_app}:${APP_DB_PASSWORD:-CHANGE_ME_DEV}@supabase_db_gustav-alpha2:5432/postgres
      - LEARNING_DATABASE_URL=${LEARNING_DATABASE_URL:-postgresql://${APP_DB_USER:-gustav_app}:${APP_DB_PASSWORD:-CHANGE_ME_DEV}@supabase_db_gustav-alpha2:5432/postgres}
      # Teaching repo DSN uses same credentials/host unless overridden.
      - TEACHING_DATABASE_URL=${TEACHING_DATABASE_URL:-postgresql://${APP_DB_USER:-gustav_app}:${APP_DB_PASSWORD:-CHANGE_ME_DEV}@supabase_db_gustav-alpha2:5432/postgres}
      # Sessions DSN (service role; app_sessions policies allow server-side access)
      - SESSION_DATABASE_URL=${SESSION_DATABASE_URL:-postgresql://postgres:postgres@supabase_db_gustav-alpha2:5432/postgres}
      # Share dev upload root with worker so Vision can read image bytes
      - STORAGE_VERIFY_ROOT=${STORAGE_VERIFY_ROOT:-/app/.tmp/dev_uploads}
      - REQUIRE_STORAGE_VERIFY=${REQUIRE_STORAGE_VERIFY:-true}
      # Teacher-only H5P review capability tokens (must match h5p service).
      - H5P_REVIEW_TOKEN_SECRET=${H5P_REVIEW_TOKEN_SECRET:-CHANGE_ME_DEV}
    restart: unless-stopped
    # All Supabase services reachable via shared external network
    networks:
      - gustav-alpha2-network
      - supabase_network_gustav-alpha2

  h5p:
    build:
      context: ./h5p-service
    container_name: gustav-h5p
    # behind proxy; no direct host port mapping
    volumes:
      # H5P content/libraries (single-host dev bind mount)
      - ./supabase/storage/h5p:/data/h5p:z
    environment:
      # Service listens on this port inside the compose network
      - PORT=3000
      - GUSTAV_ENV=${GUSTAV_ENV:-dev}
      # Internal URL to validate gustav_session via /api/me (cookie forwarded)
      - GUSTAV_WEB_INTERNAL_BASE=http://gustav-alpha2:8000
      - SESSION_COOKIE_NAME=gustav_session
      # Small cache to reduce load on /api/me during editor/player asset bursts
      - AUTH_CACHE_TTL_SECONDS=30
      # Filesystem-based storage root (mounted from repo under supabase/storage)
      - H5P_STORAGE_ROOT=/data/h5p
      # Hard limit for uploaded .h5p ZIP packages (defense-in-depth).
      - H5P_MAX_UPLOAD_BYTES=104857600
      # Must match the web service secret (used to validate review tokens).
      - H5P_REVIEW_TOKEN_SECRET=${H5P_REVIEW_TOKEN_SECRET:-CHANGE_ME_DEV}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - gustav-alpha2-network

  learning-worker:
    build: .
    container_name: gustav-learning-worker
    extra_hosts:
      # Ensure host-local inference endpoints (e.g. localhost:8111) are reachable from the container.
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "backend.learning.workers.process_learning_submission_jobs"]
    volumes:
      - ./backend/learning:/app/backend/learning:z
      - ./backend/vision:/app/backend/vision:z
      - ./backend/__init__.py:/app/backend/__init__.py:z
      # Shared dev uploads directory (same path as in web)
      - ./.tmp/dev_uploads:/app/.tmp/dev_uploads:z
    env_file:
      - .env
    environment:
      # Internal Supabase gateway (Kong) reachable via shared network
      - SUPABASE_URL=http://supabase_kong_gustav-alpha2:8000
      - LOG_LEVEL=${WORKER_LOG_LEVEL:-INFO}
      # Worker DSN: defaults to the app login role (gustav_app) so RLS stays active.
      - LEARNING_DATABASE_URL=${LEARNING_DATABASE_URL:-postgresql://${APP_DB_USER:-gustav_app}:${APP_DB_PASSWORD:-CHANGE_ME_DEV}@supabase_db_gustav-alpha2:5432/postgres}
      # Learning AI (DSPy-only via OpenAI-compatible endpoint; no path rules, no implicit "/v1")
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_TEXT_MODEL=${AI_TEXT_MODEL:-}
      - AI_OCR_MODEL=${AI_OCR_MODEL:-}
      - AI_VISUAL_MODEL=${AI_VISUAL_MODEL:-}
      - AI_TEXT_TEMPERATURE=${AI_TEXT_TEMPERATURE:-0.0}
      - AI_OCR_TEMPERATURE=${AI_OCR_TEMPERATURE:-0.0}
      - AI_VISUAL_TEMPERATURE=${AI_VISUAL_TEMPERATURE:-0.0}
      # DSPy caching (performance-critical; stored inside the container filesystem)
      - DSPY_CACHEDIR=${DSPY_CACHEDIR:-/tmp/dspy_cache}
      # Keep the default conservative; override via `.env` when needed.
      - DSPY_CACHE_LIMIT=${DSPY_CACHE_LIMIT:-4294967296}
      - WORKER_MAX_RETRIES=${WORKER_MAX_RETRIES:-3}
      - WORKER_BACKOFF_SECONDS=${WORKER_BACKOFF_SECONDS:-10}
      - WORKER_LEASE_SECONDS=${WORKER_LEASE_SECONDS:-45}
      - WORKER_POLL_INTERVAL=${WORKER_POLL_INTERVAL:-0.5}
      # Avoid flaky unit tests when a docker worker is running while pytest
      # runs the app in-process: skip jobs tagged with `_gustav_source=pytest`.
      - WORKER_SKIP_PYTEST_JOBS=${WORKER_SKIP_PYTEST_JOBS:-true}
      - AUTO_CREATE_STORAGE_BUCKETS=false
      # Allow storage3 fallback in container even when using host.docker.internal
      - SUPABASE_FALLBACK_STORAGE3=true
      # Share dev upload root to enable Vision to read uploaded files in dev
      - STORAGE_VERIFY_ROOT=${STORAGE_VERIFY_ROOT:-/app/.tmp/dev_uploads}
      - REQUIRE_STORAGE_VERIFY=${REQUIRE_STORAGE_VERIFY:-true}
    restart: unless-stopped
    # All Supabase services reachable via shared external network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys; from backend.learning.workers.health import LearningWorkerHealthService; status = LearningWorkerHealthService()._probe_sync().status; sys.exit(0 if status == 'healthy' else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - gustav-alpha2-network
      - supabase_network_gustav-alpha2

  keycloak:
    build:
      context: .
      dockerfile: keycloak/Dockerfile
    container_name: gustav-keycloak
    command: ["start", "--optimized", "--import-realm"]
    env_file:
      - .env
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
      KC_DB_URL_PROPERTIES: ${KC_DB_URL_PROPERTIES:-sslmode=disable}
      KC_PROXY: edge
      KC_HOSTNAME_URL: ${KC_HOSTNAME_URL:-https://id.localhost}
      KC_HOSTNAME_ADMIN_URL: ${KC_HOSTNAME_ADMIN_URL:-https://id.localhost}
      # Email sender configuration (Quarkus-based) for verification + reset mails
      KC_SPI_EMAIL_SENDER_DEFAULT_HOST: ${KC_SMTP_HOST:-}
      KC_SPI_EMAIL_SENDER_DEFAULT_PORT: ${KC_SMTP_PORT:-587}
      KC_SPI_EMAIL_SENDER_DEFAULT_FROM: ${KC_SMTP_FROM:-}
      KC_SPI_EMAIL_SENDER_DEFAULT_FROM_DISPLAY_NAME: ${KC_SMTP_FROM_NAME:-GUSTAV-Lernplattform}
      KC_SPI_EMAIL_SENDER_DEFAULT_USERNAME: ${KC_SMTP_USER:-}
      KC_SPI_EMAIL_SENDER_DEFAULT_PASSWORD: ${KC_SMTP_PASSWORD:-}
      KC_SPI_EMAIL_SENDER_DEFAULT_AUTH: ${KC_SMTP_AUTH:-true}
      KC_SPI_EMAIL_SENDER_DEFAULT_STARTTLS: ${KC_SMTP_STARTTLS:-true}
    depends_on:
      keycloak-db:
        condition: service_healthy
    # Theme and app CSS are baked into the image for reproducible deployments
    # No host port mapping in local-only mode; reachable via caddy reverse proxy
    restart: unless-stopped
    networks:
      - gustav-alpha2-network

  keycloak-db:
    image: postgres:16
    container_name: gustav-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KC_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USERNAME:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - gustav-alpha2-network

networks:
  gustav-alpha2-network:
    driver: bridge
  supabase_network_gustav-alpha2:
    external: true
volumes:
  keycloak_pg_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
