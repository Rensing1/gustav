[pytest]
markers =
    e2e: end-to-end tests requiring running Keycloak + web services
    supabase_integration: tests requiring local Supabase Storage (RUN_SUPABASE_E2E=1)
    openai_integration: tests requiring a local OpenAI-compatible endpoint (RUN_OPENAI_E2E=1)
    integration: integration tests requiring local services or binaries (e.g., pg_dump)
    db_read: tests that read a real database
    db_write: tests that write isolated rows to a real database
    scratch_db_required: tests that require a disposable database/schema
testpaths =
    backend/tests
    backend/tests_e2e
norecursedirs =
    .*
    build
    dist
    node_modules
    venv
    .venv
    0_backup
    legacy*
