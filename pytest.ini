[pytest]
markers =
    e2e: end-to-end tests requiring running Keycloak + web services
    supabase_integration: tests requiring local Supabase Storage (RUN_SUPABASE_E2E=1)
    openai_integration: tests requiring a local OpenAI-compatible endpoint (RUN_OPENAI_E2E=1)
    integration: integration tests requiring local services or binaries (e.g., pg_dump)
    db_read: tests that read a real database
    db_write: tests that write isolated rows to a real database
    scratch_db_required: tests that require a disposable database/schema
    legacy_migration: retired Alpha1 import tests; skipped by default unless RUN_LEGACY_MIGRATION_TESTS=1
testpaths =
    backend/tests
    backend/tests_e2e
norecursedirs =
    .*
    build
    dist
    node_modules
    venv
    .venv
    0_backup
    legacy*
filterwarnings =
    # Third-party warnings from pinned packages; keep these filters narrow so
    # new warnings in GUSTAV code still surface during `make verify`.
    ignore:The 'prefix' argument in InputField/OutputField is deprecated.*:DeprecationWarning:dspy\..*
    ignore:The `gotrue` package is deprecated.*:DeprecationWarning:supabase\._async\.auth_client
