<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student: Lerneinheit (Hybrid – Sticky Toolbar)</title>
    <link rel="stylesheet" href="../../backend/web/static/css/gustav.css" />
    <link rel="stylesheet" href="../shared/student-graph-canvas.css" />
    <link rel="stylesheet" href="../shared/student-module.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="../shared/theme.js"></script>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Zum Hauptinhalt springen</a>

    <button
      class="sidebar-toggle"
      type="button"
      data-action="sidebar-toggle"
      aria-label="Navigation umschalten"
      aria-controls="sidebar"
      aria-expanded="false"
    >
      <span class="sidebar-toggle-icon">☰</span>
    </button>

    <aside class="sidebar" id="sidebar" aria-label="Seitenleiste">
      <nav class="sidebar-nav" role="navigation" aria-label="Hauptnavigation">
        <div class="sidebar-header">
          <span class="sidebar-logo" aria-hidden="true"></span>
          <span class="sidebar-title">GUSTAV</span>
        </div>

        <div class="sidebar-items">
          <a class="sidebar-link" href="#/" data-app-href="/" aria-label="Startseite" role="menuitem">
            <span class="nav-icon">🏠</span><span class="nav-text">Startseite</span>
          </a>
          <a class="sidebar-link" href="#/learning" data-app-href="/learning" aria-label="Meine Kurse" role="menuitem">
            <span class="nav-icon">📚</span><span class="nav-text">Meine Kurse</span>
          </a>
          <a class="sidebar-link" href="#/about" data-app-href="/about" aria-label="Über GUSTAV" role="menuitem">
            <span class="nav-icon">ℹ️</span><span class="nav-text">Über GUSTAV</span>
          </a>
          <a class="sidebar-link" href="../" aria-label="UI Dummies" role="menuitem">
            <span class="nav-icon">🧩</span><span class="nav-text">UI Dummies</span>
          </a>
        </div>

        <div class="sidebar-footer">
          <div class="user-info-compact">
            <span class="nav-icon">👤</span>
            <div class="nav-text">
              <div class="user-name">Max Mustermann</div>
              <div class="user-role">Schüler</div>
            </div>
          </div>
        </div>
      </nav>
    </aside>

    <div
      class="sidebar-overlay"
      data-action="sidebar-close"
      role="button"
      tabindex="0"
      aria-label="Navigation schließen"
    ></div>

    <main id="main-content" class="main-content" role="main">
      <nav class="breadcrumb" aria-label="Breadcrumb" id="breadcrumb" hidden>
        <ol id="breadcrumb-list"></ol>
      </nav>

      <header class="container unit-head">
        <div class="unit-head__title">
          <h1 class="unit-title" id="unit-title">Beispiel-Lerneinheit: Module als Graph</h1>
          <p class="text-muted" id="unit-subtitle">
            <small>Hybrid: normaler Seiten-Scroll, nur eine kleine Toolbar bleibt sticky.</small>
          </p>
        </div>
        <div class="unit-head__actions">
          <button class="btn btn-secondary" type="button" data-theme-toggle>Theme wechseln</button>
          <button class="btn btn-secondary" type="button" id="btn-reset-state">State reset</button>
        </div>
      </header>

      <div class="sticky-toolbar" role="region" aria-label="Ansicht und offene Module">
        <div class="container sticky-toolbar__inner">
          <div class="mode-segmented" role="group" aria-label="Ansicht">
            <button class="btn mode-segmented__btn" type="button" id="btn-view-overview" aria-pressed="true">
              Übersicht
            </button>
            <button class="btn mode-segmented__btn" type="button" id="btn-view-content" aria-pressed="false">
              Inhalte
            </button>
          </div>

          <nav class="tabs tabs--sticky" id="open-tabs" aria-label="Offene Module" hidden></nav>
        </div>
      </div>

      <section class="container workspace-view workspace-view--overview" id="view-overview" aria-label="Übersicht">
        <div class="graph-container graph-shell" id="graph-shell">
          <div class="graph-layer graph-layer--map" id="graph-layer"></div>
        </div>
      </section>

      <section class="container workspace-view workspace-view--content" id="view-content" aria-label="Inhalte" hidden>
        <div id="content-root" class="content-root" aria-label="Phasen und Module"></div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
